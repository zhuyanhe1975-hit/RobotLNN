name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public bundle only. Never read GEMINI_API_KEY into the client build.
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Pull requests build the project path before a Pages site exists.
      # configure-pages with enablement creates the site; without it, deploy
      # fails with "Get Pages site failed ... Not Found".
      - name: Enable and configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build -- --base /RobotLNN/

      - name: Check Pages base path
        run: grep -q '/RobotLNN/' dist/index.html

      - name: Check bundle has no API key
        run: |
          if grep -R -E 'AIza[0-9A-Za-z_-]{20,}' dist; then
            echo "Refusing to publish a bundle that contains an API key."
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
